name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Validate skills
        run: bash scripts/validate-skills.sh
      - name: Run plugin layout tests
        run: python3 -m unittest discover -s plugins/web-design-guidelines/tests -p 'test_*.py' -v

  merge-gate:
    if: always()
    needs:
      - validate-skills
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate validation results
        shell: bash
        run: |
          set -euo pipefail

          echo "validate-skills: ${{ needs.validate-skills.result }}"
          [ "${{ needs.validate-skills.result }}" = "success" ]
