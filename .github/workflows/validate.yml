name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Validate skills
        run: bash scripts/validate-skills.sh
      - name: Run plugin layout tests
        run: python3 -m unittest discover -s plugins/web-design-guidelines/tests -p 'test_*.py' -v

  merge-gate:
    if: always()
    needs:
      - validate-skills
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate validation results
        shell: bash
        run: |
          set -euo pipefail

          echo "validate-skills: ${{ needs.validate-skills.result }}"
          [ "${{ needs.validate-skills.result }}" = "success" ]
